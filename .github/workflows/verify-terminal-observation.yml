name: Verify Terminal observation

on:
  push:
    branches: [verify-terminal-observation]
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4 and show toolchains
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          sw_vers
          xcodebuild -version
          swift --version

      - name: SwiftPM Terminal observation tests
        run: swift test --filter TerminalObservationTests

      - name: Strict Terminal observation compilation
        run: |
          swift package clean
          swift build --target TerminalObservation \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors

      - name: SwiftPM all tests
        run: swift test

      - name: Xcode generated-package tests
        run: |
          package_dir="$(mktemp -d)"
          cp Package.swift "$package_dir/"
          mkdir -p "$package_dir/ShellMate" "$package_dir/Tests"
          cp -R ShellMate/SuggestionLookup ShellMate/OpenAILifecycle ShellMate/AttachmentGeometry ShellMate/CredentialManagement ShellMate/TerminalObservation "$package_dir/ShellMate/"
          cp -R Tests/SuggestionLookupTests Tests/OpenAILifecycleTests Tests/AttachmentGeometryTests Tests/CredentialManagementTests Tests/TerminalObservationTests "$package_dir/Tests/"
          cd "$package_dir"
          xcodebuild \
            -scheme ShellMateSuggestionLookup-Package \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Prepare placeholder build configuration
        run: cp Template.Secrets.xcconfig Secrets.xcconfig

      - name: Resolve application dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project ShellMate.xcodeproj \
            -scheme ShellMate

      - name: Build application
        run: |
          xcodebuild \
            -project ShellMate.xcodeproj \
            -scheme ShellMate \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath /tmp/ShellMateDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build CLI
        run: |
          xcodebuild \
            -project ShellMate.xcodeproj \
            -scheme ShellMateCLI \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath /tmp/ShellMateCLIDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
